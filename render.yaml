# تكوين Render.com للسيرفر الخلفي
# انشر هذا الجزء على Render كـ "Web Service"

services:
  - type: web
    name: classico-algerie-server
    env: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
